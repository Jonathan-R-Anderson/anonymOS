timeout: 0
verbose: yes
serial: yes
textmode: no
interface_branding: EpinAnonymOS

/EpinAnonymOS
    protocol: limine
    path: boot():/boot/kernel.elf
    framebuffer_width: 1920
    framebuffer_height: 1080
    framebuffer_bpp: 32
    module_path: boot():/busybox
    module_path: boot():/test-drm
    module_path: boot():/compositor
    module_path: boot():/hello-gui
    module_path: boot():/Hyprland
    module_path: boot():/ld-musl-x86_64.so.1
    module_path: boot():/kms_swrast_dri.so
    module_path: boot():/swrast_dri.so
