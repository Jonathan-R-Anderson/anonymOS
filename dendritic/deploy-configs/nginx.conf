# Network-only nginx for dendritic.network.
#
# Rewritten from the imageboard config (kept at nginx.conf.imageboard.bak) when
# the site was reduced to network infrastructure. What went away and why:
#   - anubis auth_request gate on every location: it fronted an imageboard under
#     bot pressure; a node/status site does not need a challenge wall, and a
#     broken auth_request subrequest fails every gated route closed.
#   - ceph / tracker / seedbox / ergo / rtmp upstreams: those services were
#     stripped from the stack, so proxying to them could only 502.
# What stayed: the uwsgi app on :3031, the frontend on :3000, the ACME webroot,
# and the /.well-known/syndichan endpoints the node network reads.

worker_processes auto;
events { worker_connections 1024; }

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;
	keepalive_timeout 65;
	server_tokens off;
	client_max_body_size 32m;

	# Docker's embedded DNS, so an upstream that restarts is re-resolved rather
	# than pinned to a dead container IP at worker start.
	resolver 127.0.0.11 valid=30s ipv6=off;
	resolver_timeout 5s;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	# The nginx image's entrypoint writes these from $DOMAIN: a default-deny
	# catch-all that 444s any Host/SNI other than dendritic.network, so a raw-IP
	# or parked-domain request never reaches the app. Included here so the file
	# nginx.conf depends on always exists (the Dockerfile seeds an empty one).
	include /etc/nginx/domain-guard/default-deny.conf;

	# NOTE: no `upstream` blocks. nginx resolves an upstream server name ONCE at
	# startup, so recreating the app container (new IP) 502s every request until
	# nginx is restarted -- which is exactly what happened after a rebuild.
	# Assigning to a variable defers resolution to request time via the docker
	# resolver declared above.
	# The gateway controller registers nodes and drives name.com DNS. It runs in
	# its own compose project on the loopback host port; reached here through the
	# docker host gateway so this stack and the controller stay separable.
	upstream gateway  { server host.docker.internal:8080; }

	# ---- HTTP :80 — ACME challenge, then redirect everything else to HTTPS ----
	server {
		listen 80;
		listen [::]:80;
		server_name dendritic.network www.dendritic.network;

		# Let's Encrypt http-01 webroot. Served before the redirect so renewal
		# works without taking the site down.
		location /.well-known/acme-challenge/ {
			root /acme-webroot;
			default_type "text/plain";
		}

		location / {
			return 301 https://$host$request_uri;
		}
	}

	# ---- HTTPS :443 ----
	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		http2 on;
		server_name dendritic.network www.dendritic.network;

		# certbot writes the live cert here; a self-signed default.{crt,key} is
		# the fallback so nginx starts before the first issuance.
		ssl_certificate     /etc/nginx/tls/default.crt;
		ssl_certificate_key /etc/nginx/tls/default.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers off;
		ssl_session_cache shared:SSL:10m;
		ssl_session_timeout 1d;

		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;

		# Node registration + the gateway API. Proxied to the controller, which
		# owns /api/v1/gateways{,/reserve,/register,/unregister}.
		location /api/v1/gateways {
			proxy_pass http://gateway;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# The node network reads these directly; they are public and unauthed.
		location /.well-known/syndichan/ {
			set $app_upstream maniwani:3031;
			uwsgi_pass $app_upstream;
			include /etc/nginx/uwsgi_params;
		}

		# NOTE: deliberately no `location /static/` block. Flask serves the
		# app's own static assets (themes, fontawesome); the imageboard config
		# did the same by letting /static fall through to `location /`.
		# Proxying /static/ to the frontend container 404s every stylesheet,
		# because that image does not contain them.

		# Server-sent events / websockets for live status updates.
		location /api/v1/events {
			set $app_upstream maniwani:3031;
			uwsgi_pass $app_upstream;
			include /etc/nginx/uwsgi_params;
			uwsgi_buffering off;
			uwsgi_read_timeout 3600s;
		}

		# Everything else is the Flask app over uwsgi.
		location / {
			set $app_upstream maniwani:3031;
			uwsgi_pass $app_upstream;
			include /etc/nginx/uwsgi_params;
			uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
		}
	}
}
