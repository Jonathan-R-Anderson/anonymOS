# Apply manually before the gateway-controller runtime manifest. This file is
# intentionally outside k8s/ because the automatic updater must never own,
# inspect, or apply RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-controller
  namespace: maniwani
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-controller-network-policy
  namespace: maniwani
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    resourceNames: ["nginx-gateway-ingress"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-controller-network-policy
  namespace: maniwani
subjects:
  - kind: ServiceAccount
    name: gateway-controller
    namespace: maniwani
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-controller-network-policy
