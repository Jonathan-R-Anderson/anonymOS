# =============================================================================
# maniwani UPDATER — SECRET INVENTORY (NAMES ONLY, NEVER VALUES)
# =============================================================================
# *** THIS FILE IS A CHECKLIST, NOT A DEPLOYABLE. ***
#
# Same interlock as k8s/bootstrap/secret.example.yaml: every metadata.name below
# ends in `-example-do-not-apply`, and NOTHING in k8s/ references those names.
# `kubectl apply -f 10-secrets.example.yaml` therefore creates two inert objects
# and cannot clobber a real Secret. Do not "tidy" the suffix away and do not sed
# it out to bootstrap the cluster.
#
# TWO SECRETS. Both are created IMPERATIVELY, from files, by the commands below.
# No value passes through this repo, a shell argv, or a terminal.
#
#   maniwani-git-deploy-key   the read-only GitHub deploy key. THE reason the
#                             updater can reach a private repo.
#   maniwani-deploy-auth      bcrypt htpasswd guarding /_deploy/ on the edge, so
#                             the failure log is readable in a browser without
#                             SSH and without being world-readable.
#
# A third Secret is CONSUMED but not owned here: `maniwani-env`, which already
# exists (bootstrap README §5.2). The updater reads four keys from it via
# secretKeyRef — POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB for the
# pre-migration pg_dump, and DOMAIN for the post-deploy smoke test. It needs no
# RBAC to do so: secretKeyRef is resolved by the kubelet, not the SA. See
# 00-serviceaccount-rbac.yaml (a).
#
# =============================================================================
# 1. maniwani-git-deploy-key — THE GITHUB CREDENTIAL
# =============================================================================
# The remote is  git@github.com:Jonathan-R-Anderson/maniwani.git  over SSH, and
# the repo is PRIVATE from the cluster's point of view.
#
#   >>> ANONYMOUS HTTPS DOES NOT WORK AND IS NOT A FALLBACK. <<<
#
# An in-cluster pod has no SSH key unless you give it one. `git clone https://`
# against this repo prompts for credentials, which in a non-interactive Job
# manifests as the clone hanging until activeDeadlineSeconds and a completely
# unhelpful "terminal prompts disabled" line buried in the log. update.sh sets
# GIT_TERMINAL_PROMPT=0 so it fails fast and loudly instead, but the fix is the
# key, not the timeout.
#
# -----------------------------------------------------------------------------
# WHAT KIND OF KEY — this is the part that matters
# -----------------------------------------------------------------------------
#   * A REPOSITORY DEPLOY KEY. Not a user SSH key (which would give the node
#     access to every repo the account can reach) and not a Personal Access
#     Token (broader still, and it expires in a way that fails at 3am).
#     GitHub -> repo -> Settings -> Deploy keys -> Add deploy key.
#
#   * >>> "Allow write access" MUST STAY UNCHECKED. <<<
#     This is the single most important checkbox in the whole feature. The
#     updater builds Dockerfiles from this repo as root on the software node
#     (see 40-cronjob.yaml): push access to main is already equivalent to root
#     on the node. A WRITE-capable deploy key would make the arrow point both
#     ways, so that root on the node also becomes push access to the repo, and
#     a single node compromise would poison every future deploy. Read-only
#     keeps the compromise directional.
#
#   * Ed25519. Small, no parameter choices to get wrong, and supported by every
#     git/ssh in play.
#
# -----------------------------------------------------------------------------
# CREATE IT (on an operator machine — NOT on the server, NOT in this checkout)
# -----------------------------------------------------------------------------
#   umask 077
#   d="$(mktemp -d)" && cd "$d"
#   ssh-keygen -t ed25519 -N '' -C 'maniwani-updater (read-only)' -f deploy
#
#   # 1. paste deploy.pub into GitHub -> Deploy keys.  WRITE ACCESS OFF.
#   cat deploy.pub
#
#   # 2. the private half goes straight into the cluster and nowhere else
#   kubectl -n maniwani create secret generic maniwani-git-deploy-key \
#     --from-file=id_ed25519=deploy
#
#   shred -u deploy deploy.pub && cd / && rmdir "$d"
#
# The key material never lands on the software node's filesystem: the updater
# pod mounts this Secret at /secrets/git (tmpfs, defaultMode 0400) and git reads
# it from there. Nothing persists to the PVC.
#
# ROTATION IS THE WHOLE POINT OF THE FEATURE, so it must not need SSH:
#   ssh-keygen ... ; add the new .pub to GitHub ; then
#   kubectl -n maniwani create secret generic maniwani-git-deploy-key \
#     --from-file=id_ed25519=deploy --dry-run=client -o yaml | kubectl apply -f -
#   ... then delete the old key in the GitHub UI. The next CronJob run picks up
#   the new Secret automatically; there is no cached copy to invalidate.
#
# HOST KEY VERIFICATION is NOT part of this Secret. github.com's host keys ship
# as a ConfigMap in 30-configmap-updater.yaml and update.sh runs ssh with
# StrictHostKeyChecking=yes against them. TOFU (`accept-new`) in an unattended
# job is not verification; it just means the first MITM wins silently.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: maniwani-git-deploy-key-example-do-not-apply
  namespace: maniwani
  labels:
    app.kubernetes.io/part-of: maniwani
    app.kubernetes.io/component: updater
    maniwani.io/purpose: key-inventory
  annotations:
    maniwani.io/real-name: "maniwani-git-deploy-key"
    maniwani.io/how: "k8s/updater/README.md §2 — ssh-keygen on an operator box; write access OFF"
    maniwani.io/consumed-by: "CronJob/maniwani-updater, volume `git-key`, mounted /secrets/git"
type: Opaque
stringData:
  # THE OPENSSH PRIVATE KEY, verbatim, including the BEGIN/END lines and the
  # trailing newline. Exactly one key. `--from-file=id_ed25519=<file>` produces
  # this shape; do not hand-paste it, because a lost trailing newline yields
  # "error in libcrypto" and nothing more useful.
  #
  # The corresponding PUBLIC key is NOT stored here. It lives in GitHub. Storing
  # it would tempt someone into regenerating one from the other and getting the
  # comment field wrong, which is how deploy keys end up unidentifiable in an
  # account with six of them.
  id_ed25519: ""
---
# =============================================================================
# 2. maniwani-deploy-auth — HTTP BASIC FOR /_deploy/
# =============================================================================
# Guards the operator-visible failure log served by the edge (see
# 80-nginx-deploy-status.yaml). The log contains build output, pod logs and
# kubectl events for a private site; it is not a secret store, but it is not
# public information either, and it must not be indexed.
#
# WHY BASIC AUTH AND NOT THE ADMIN PANEL — this is a requirements decision, not
# a preference. The single most important failure this log has to explain is
# "the backend was updated and now it crashloops". In that state the Flask app
# IS DOWN, so an admin-panel log viewer is unavailable exactly when it is needed.
# Anything that depends on the backend is disqualified by construction. nginx
# has no dependency on postgres, redis, the object store or the app, it is rolled last and
# least often, and it already serves the @starting page while the backend is
# dead — so it is the only component in the stack that is reliably up during the
# failure the operator is trying to read about.
#
# -----------------------------------------------------------------------------
# CREATE IT
# -----------------------------------------------------------------------------
#   umask 077
#   d="$(mktemp -d)" && cd "$d"
#   # -B = bcrypt. nginx supports it; the apr1/crypt defaults are not acceptable
#   # for a file that sits on a PVC. -n prints to stdout, so no argv exposure of
#   # the password beyond this one command — prefer the interactive form:
#   htpasswd -nBC 12 ops > htpasswd        # prompts for the password twice
#   kubectl -n maniwani create secret generic maniwani-deploy-auth \
#     --from-file=htpasswd=htpasswd
#   shred -u htpasswd && cd / && rmdir "$d"
#
# Use a long random password from a password manager. This endpoint is reachable
# from the internet the moment the edge serves it, and it is the one URL in the
# stack that is NOT behind Anubis (it has to be — a JS proof-of-work challenge
# makes the log unreadable from curl and from a freshly-cleared browser, which
# is the exact situation you are in at 3am).
#
# ROTATION: same `--dry-run=client -o yaml | kubectl apply -f -` pattern. The
# Secret is mounted as a plain volume (no subPath), so the kubelet DOES
# propagate the update into the running nginx pod, and nginx re-reads
# auth_basic_user_file per request rather than caching it at config load. In
# practice no restart is needed — but VERIFY THAT ONCE on your nginx build
# rather than trusting it during an incident, and fall back to
# `kubectl -n maniwani rollout restart deploy/nginx` (which costs the usual
# 5-15 s edge outage) if the old password still works.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: maniwani-deploy-auth-example-do-not-apply
  namespace: maniwani
  labels:
    app.kubernetes.io/part-of: maniwani
    app.kubernetes.io/component: updater
    maniwani.io/purpose: key-inventory
  annotations:
    maniwani.io/real-name: "maniwani-deploy-auth"
    maniwani.io/how: "k8s/updater/README.md §6 — htpasswd -nBC 12 ops"
    maniwani.io/consumed-by: "Deployment/nginx, volume `deploy-auth`, /etc/nginx/deploy-auth/htpasswd"
type: Opaque
stringData:
  # One or more `user:$2y$12$...` lines. bcrypt only.
  htpasswd: ""
# =============================================================================
# WHAT IS *NOT* A SECRET HERE, AND WHY
# -----------------------------------------------------------------------------
#   * github.com host keys      -> ConfigMap (public data; integrity matters,
#                                  confidentiality does not)
#   * allowed_signers           -> ConfigMap, if REQUIRE_SIGNED=1. Public keys.
#   * the kubeconfig / SA token -> neither. The pod uses its projected
#                                  ServiceAccount token at
#                                  /var/run/secrets/kubernetes.io/serviceaccount,
#                                  which the kubelet rotates hourly. There is NO
#                                  long-lived token file anywhere in this design,
#                                  and /etc/rancher/k3s/k3s.yaml (cluster-admin)
#                                  is never mounted, never read, never referenced.
# =============================================================================
