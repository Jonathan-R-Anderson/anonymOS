# /etc/disk-reclaim/monitor.conf — snoop-monitor settings (key=value; # comments ok).
#
# snoop-monitor watches for snooping and fires disk-reclaim (which wipes the hidden OS).
# It fires ONLY when: armed (/etc/disk-reclaim/arm.key exists) AND no safe override
# (/etc/disk-reclaim/safe) AND MONITOR_DRY=0. Fire policy: any IMMEDIATE signal, or any
# two signals together.
#
# >>> SHIPPED SAFE: MONITOR_DRY=1 below means it only logs "WOULD FIRE" and never fires.
# >>> Set MONITOR_DRY=0 (and provision the arm key) only when you have tested the signals.

MONITOR_DRY=1

MONITOR_INTERVAL=5

# built-in signals
SIG_PTRACE=1
SIG_AUTH=1
SIG_BOOTMM=1
SIG_EXTERNAL=1          # honour /etc/disk-reclaim/detectors.json (argus/orin/spectre/…)

# auth brute-force: this many failures within this window (seconds)
AUTH_THRESHOLD=5
AUTH_WINDOW=300
AUTH_LOGS=/var/log/messages,/var/log/auth.log,/var/log/secure

# boot-environment: tolerate this much backward clock movement before it counts (seconds)
CLOCK_SLACK=86400

# process names permitted to be traced without tripping ptrace (comma-separated). Leave
# empty on a real decoy — nothing should be under a debugger there.
PTRACE_ALLOW=
