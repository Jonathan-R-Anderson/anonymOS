title: AWS Credentials Access
id: spectre-credaccess-005
description: Detects access to AWS credential files
status: stable
author: Spectre Project
date: 2024-01-15
logsource:
    category: file_event
    product: linux
detection:
    selection_aws_creds:
        TargetFilename|contains:
            - '.aws/credentials'
            - '.aws/config'
            - '.boto'
    condition: selection_aws_creds
level: high
tags:
    - attack.t1552.001
    - attack.credential_access
references:
    - https://attack.mitre.org/techniques/T1552/001/
falsepositives:
    - Legitimate AWS CLI usage
license: MIT