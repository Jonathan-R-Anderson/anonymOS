title: Browser Credential Store Access
id: spectre-credaccess-003
description: Detects access to browser credential databases
status: stable
author: Spectre Project
date: 2024-01-15
logsource:
    category: file_event
    product: linux
detection:
    selection_browser_creds:
        TargetFilename|contains:
            - 'Login Data'
            - 'Cookies'
            - 'Web Data'
            - 'signons.sqlite'
            - 'logins.json'
            - 'key4.db'
    condition: selection_browser_creds
level: high
tags:
    - attack.t1555.003
    - attack.credential_access
references:
    - https://attack.mitre.org/techniques/T1555/003/
falsepositives:
    - Legitimate browser usage
    - Password managers
license: MIT