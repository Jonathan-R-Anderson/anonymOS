title: Docker Credential Access
id: spectre-credaccess-006
description: Detects access to Docker credential files
status: stable
author: Spectre Project
date: 2024-01-15
logsource:
    category: file_event
    product: linux
detection:
    selection_docker_creds:
        TargetFilename|contains:
            - '.docker/config.json'
            - '.dockercfg'
    condition: selection_docker_creds
level: high
tags:
    - attack.t1552.001
    - attack.credential_access
references:
    - https://attack.mitre.org/techniques/T1552/001/
falsepositives:
    - Legitimate Docker usage
license: MIT