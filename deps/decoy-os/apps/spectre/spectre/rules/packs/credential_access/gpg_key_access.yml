title: GPG Key Access
id: spectre-credaccess-004
description: Detects access to GPG private keys
status: stable
author: Spectre Project
date: 2024-01-15
logsource:
    category: file_event
    product: linux
detection:
    selection_gpg_keys:
        TargetFilename|contains:
            - '.gnupg/secring.gpg'
            - '.gnupg/private-keys-v1.d/'
    condition: selection_gpg_keys
level: high
tags:
    - attack.t1555.001
    - attack.credential_access
references:
    - https://attack.mitre.org/techniques/T1555/001/
falsepositives:
    - Legitimate GPG usage
license: MIT