title: SSH Key Access
id: spectre-credaccess-002
description: Detects access to SSH private keys
status: stable
author: Spectre Project
date: 2024-01-15
logsource:
    category: file_event
    product: linux
detection:
    selection_ssh_keys:
        TargetFilename|endswith:
            - 'id_rsa'
            - 'id_ed25519'
            - 'id_ecdsa'
            - 'id_dsa'
    condition: selection_ssh_keys
level: high
tags:
    - attack.t1555.004
    - attack.credential_access
references:
    - https://attack.mitre.org/techniques/T1555/004/
falsepositives:
    - Legitimate SSH usage
    - Backup tools
license: MIT