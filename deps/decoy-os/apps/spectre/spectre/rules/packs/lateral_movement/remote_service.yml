title: Remote Service Creation
id: spectre-lateral-003
description: Detects creation of remote services via tools like sc, schtasks, or systemd
status: stable
author: Spectre Project
date: 2024-01-15
logsource:
    category: process_creation
    product: linux
detection:
    selection_service_tools:
        Image|endswith:
            - '/systemctl'
            - '/service'
            - '/sc'
    selection_remote_target:
        CommandLine|contains:
            - '--host'
            - '-H'
            - '@'
    condition: selection_service_tools and selection_remote_target
level: high
tags:
    - attack.t1543.003
    - attack.lateral_movement
references:
    - https://attack.mitre.org/techniques/T1543/003/
falsepositives:
    - Legitimate remote administration
license: MIT