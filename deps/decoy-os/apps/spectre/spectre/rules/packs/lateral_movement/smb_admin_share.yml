title: SMB Admin Share Access
id: spectre-lateral-004
description: Detects access to administrative SMB shares (C$, ADMIN$, IPC$)
status: stable
author: Spectre Project
date: 2024-01-15
logsource:
    category: network_connection
    product: linux
detection:
    selection_smb:
        DestinationPort: 445
    selection_admin_share:
        # Would need file share access logs
    condition: selection_smb
level: high
tags:
    - attack.t1021.002
    - attack.lateral_movement
references:
