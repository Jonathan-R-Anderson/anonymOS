title: WMI/WinRM Lateral Movement
id: spectre-lateral-006
description: Detects WMI or WinRM remote execution
status: stable
author: Spectre Project
date: 2024-01-15
logsource:
    category: network_connection
    product: linux
detection:
    selection_winrm:
        DestinationPort:
            - 5985
            - 5986
    selection_wmi:
        DestinationPort: 135
    condition: selection_winrm or selection_wmi
level: high
tags:
    - attack.t1021.006
    - attack.lateral_movement
references:
    - https://attack.mitre.org/techniques/T1021/006/
falsepositives:
    - Legitimate management traffic
