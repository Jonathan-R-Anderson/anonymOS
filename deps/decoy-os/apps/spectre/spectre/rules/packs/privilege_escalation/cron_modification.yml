title: Cron Job Modification
id: spectre-privesc-005
description: Detects modification of cron jobs for persistence or privilege escalation
status: stable
author: Spectre Project
date: 2024-01-15
logsource:
    category: file_event
    product: linux
detection:
    selection_cron_files:
        TargetFilename|contains:
            - '/etc/cron'
            - '/var/spool/cron'
            - '/etc/anacrontab'
    selection_write:
        # File write events
    condition: selection_cron_files
level: high
tags:
    - attack.t1053.003
    - attack.persistence
    - attack.privilege_escalation
references:
    - https://attack.mitre.org/techniques/T1053/003/
falsepositives:
    - Legitimate cron management
    - Package installation
license: MIT