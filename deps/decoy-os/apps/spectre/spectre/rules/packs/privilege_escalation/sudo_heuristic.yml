title: Sudo Heuristic Privilege Escalation
id: spectre-privesc-001
description: Detects suspicious sudo usage patterns that may indicate privilege escalation attempts
status: stable
author: Spectre Project
date: 2024-01-15
logsource:
    category: process_creation
    product: linux
detection:
    selection_sudo:
        Image|endswith: '/sudo'
    selection_suspicious_args:
        CommandLine|contains:
            - 'sudo -i'
            - 'sudo -s'
            - 'sudo su'
            - 'sudo bash'
            - 'sudo sh'
            - 'sudo /bin/bash'
            - 'sudo /bin/sh'
    condition: selection_sudo and selection_suspicious_args
level: high
tags:
    - attack.t1548.003
    - attack.privilege_escalation
references:
    - https://attack.mitre.org/techniques/T1548/003/
falsepositives:
    - Legitimate administrative tasks
license: MIT