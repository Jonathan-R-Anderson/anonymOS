title: Shell Spawning Downloader
id: spectre-webshell-004
description: Detects shell processes spawning download utilities, potential payload delivery
status: stable
author: Spectre Project
date: 2024-01-15
logsource:
    category: process_creation
    product: linux
detection:
    selection_shell:
        ParentImage|endswith:
            - '/bash'
            - '/sh'
            - '/dash'
            - '/zsh'
            - '/ash'
    selection_downloader:
        Image|endswith:
            - '/curl'
            - '/wget'
            - '/tftp'
            - '/ftp'
    condition: selection_shell and selection_downloader
level: medium
tags:
    - attack.t1105
    - attack.t1059.004
    - attack.command_and_control
    - attack.execution
references:
    - https://attack.mitre.org/techniques/T1105/
    - https://attack.mitre.org/techniques/T1059/004/
falsepositives:
    - Legitimate software updates
    - Automated deployment scripts
license: MIT