title: Web Server Spawning Shell
id: spectre-webshell-001
description: Detects web server processes spawning shell interpreters, indicating potential web shell or RCE
status: stable
author: Spectre Project
date: 2024-01-15
logsource:
    category: process_creation
    product: linux
detection:
    selection_webserver:
        ParentImage|endswith:
            - '/nginx'
            - '/apache2'
            - '/httpd'
            - '/lighttpd'
            - '/node'
            - '/tomcat'
    selection_shell:
        Image|endswith:
            - '/bash'
            - '/sh'
            - '/dash'
            - '/zsh'
            - '/ash'
    condition: selection_webserver and selection_shell
level: high
tags:
    - attack.t1059.004
    - attack.t1505.003
    - attack.execution
    - attack.persistence
references:
    - https://attack.mitre.org/techniques/T1059/004/
    - https://attack.mitre.org/techniques/T1505/003/
falsepositives:
    - Legitimate administrative scripts
    - CI/CD build processes
license: MIT