# /etc/synthetic-logs.conf — sourced at start by /etc/init.d/synthetic-logs.
#
# Installed by apps/synthetic-logs (files/ convention). Every value here is a default
# the service would otherwise pick itself; uncomment to override. The two generator
# payloads are installed under /opt by apps/log-synth and apps/evidenceforge.

# LOGSYNTH_DIR=/opt/log-synth
# LOGSYNTH_JAR=/opt/log-synth/log-synth-0.1-SNAPSHOT-jar-with-dependencies.jar
# LOGSYNTH_SCHEMA=/opt/log-synth/schema.json
# LOGSYNTH_COUNT=1000

# EFORGE_DIR=/opt/evidenceforge
# EFORGE_SCENARIO=/opt/evidenceforge/scenarios/branch-office-example/scenario.yaml

# OUTPUT_DIR=/var/lib/synthetic-logs

# Per-generator PID marker directory. The launcher runs `mkdir ImFeelingRootNow_<PID>`
# for each generator it starts; MARKER_BASE is where that directory is created. Empty
# (the default) means the launcher's working directory — at boot, / .
# MARKER_BASE=/var/lib/synthetic-logs
