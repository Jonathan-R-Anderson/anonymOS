# /etc/sysmon.conf — sourced by /usr/local/bin/sysmon at start.
#
# This file is here to demonstrate the `files/` convention: anything under
# apps/sysmon/files/ is merged into the rootfs root, keeping its path. So
# apps/sysmon/files/etc/sysmon.conf lands at /etc/sysmon.conf.

SYSMON_INTERVAL=300
SYSMON_LOG=/var/log/sysmon.log
