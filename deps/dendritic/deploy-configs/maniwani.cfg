# Make sure to change these settings before triggering a build intended to be public-facing!
import os
INSTANCE_NAME = "Dendritic Network"
DEV_MODE = os.environ.get("DEV_MODE", os.environ.get("MANIWANI_DEV", os.environ.get("dev_mode", "false"))).lower() not in ("false", "0", "no", "off", "")
SQLALCHEMY_DATABASE_URI = "postgresql://dev:dev@postgres/dev"
RENDERER_HOST = "http://maniwani-frontend:3000"
STORAGE_PROVIDER = "S3"
S3_ENDPOINT = os.environ.get("S3_ENDPOINT", "http://host.docker.internal:9109")
CDN_REWRITE = "/s3/{BUCKET}/{PATH}"
S3_ACCESS_KEY = os.environ.get("S3_ACCESS_KEY", "")
S3_SECRET_KEY = os.environ.get("S3_SECRET_KEY", "")
STORE_PROVIDER = "REDIS"
REDIS_HOST = "redis"
SERVE_STATIC = False
SERVE_REST = True
PREFERRED_URL_SCHEME = "https"
SESSION_COOKIE_SECURE = True
MAX_CONTENT_LENGTH = 1024 ** 3 + 32 * (1024 ** 2)  # 1 GiB (video) + headroom for multipart overhead
ADMIN_WALLET_ADDRESS = os.environ.get("ADMIN_WALLET_ADDRESS", "0xB2b36AaD18d7be5d4016267BC4cCec2f12a64b6e")

# Dark theme by default (near-black + off-white text).
# Only one theme ships now. available_themes() reads THEME_LIST, so this both
# hides the picker (one option) and makes resolve_current_theme() reject a stale
# "theme=cyberpunk" cookie instead of serving a stylesheet that no longer fits.
THEME_LIST = ("midnight",)
DEFAULT_THEME = "midnight"

# NOTE: k8s does not read this file. It is copied verbatim into
# k8s/app/00-configmaps.yaml and mounted at /maniwani/runtime-config.cfg, so any
# setting added here must be added there too or it silently does nothing in the
# cluster. That gap is what made the Stripe webhook refuse every callback while
# the environment variable was demonstrably present.
#
# Stripe. The secret key stays server-side; only the publishable key is ever
# rendered into a page. An unset webhook secret disables the webhook entirely
# rather than accepting unsigned callbacks — anyone can POST to a public URL.
STRIPE_SECRET_KEY = os.environ.get("STRIPE_SECRET_KEY", "")
STRIPE_PUBLISHABLE_KEY = os.environ.get("STRIPE_PUBLISHABLE_KEY", "")
STRIPE_WEBHOOK_SECRET = os.environ.get("STRIPE_WEBHOOK_SECRET", "")
# Salt for the purchase-origin hash written on chain (Treasury.PurchaseOrigin).
# A SECRET, kept like a signing key. IPv4 is 2^32 addresses, so an unsalted
# keccak of one is reversible by brute force in an afternoon — an unpeppered
# hash on a public chain is the address itself with extra steps.
#
# Unset means origins are simply not recorded, which is the correct default:
# degrading silently to an unsalted hash would publish permanently exactly what
# the hashing exists to protect. Rotating it makes older purchases unsearchable
# by origin; their hashes stay valid as identifiers but match nothing you can
# compute.
PURCHASE_ORIGIN_PEPPER = os.environ.get("PURCHASE_ORIGIN_PEPPER", "")

ORIGIN_SIGNING_KEY = os.environ.get("ORIGIN_SIGNING_KEY", "")
ORIGIN_PUBLIC_KEY = os.environ.get("ORIGIN_PUBLIC_KEY", "")
