[uwsgi]
master = true
enable-threads = true
processes = 4
# Async (greenlet) cores PER PROCESS. Each in-flight request — including
# long-lived SSE streams (/api/v1/live, distributed sync) and any request
# waiting on a backend (DB, Redis, the ceph object store) — occupies one core
# for its lifetime. At 10 (=40 total across 4 procs) a brief backend blip or a
# burst of thumbnail/torrent requests exhausts every core and uWSGI logs
# "async queue is full", rejecting new requests. Idle greenlets are cheap, so
# a much higher ceiling just absorbs bursts. 200 x 4 = 800 concurrent.
gevent = 200
# Socket accept backlog: let bursts queue at the socket instead of being
# dropped (kernel net.core.somaxconn on this host is well above this).
listen = 1024
die-on-term = true
plugin = python3,gevent_python3

# nginx speaks uWSGI to this socket.
socket = 0.0.0.0:3031
# Internal health checks and sidecars need plain HTTP.
http-socket = 0.0.0.0:3032
wsgi-file = app.py
callable = app
lazy-apps = true
