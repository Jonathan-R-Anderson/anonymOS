# =============================================================================
# maniwani BOOTSTRAP — SECRET KEY INVENTORY (NAMES ONLY, NEVER VALUES)
# =============================================================================
# *** THIS FILE IS A CHECKLIST, NOT A DEPLOYABLE. ***
#
# Every `metadata.name` below ends in `-example-do-not-apply` and NOTHING in
# k8s/ references those names, so `kubectl apply -f secret.example.yaml` creates
# four inert objects and cannot clobber a real Secret. That suffix is a safety
# interlock — do not "tidy" it away and do not `sed` it out to bootstrap the
# cluster. The real Secrets are created IMPERATIVELY, on the software node,
# FROM THE LIVE FILES, by the commands in bootstrap/README.md §5. They are never
# committed, never templated, and no value ever passes through a shell argument,
# a here-doc in this repo, or a terminal.
#
# WHY IMPERATIVE AND NOT DECLARATIVE: the source of truth is
# /home/ubuntu/maniwani/.env on the SOFTWARE NODE (126 keys, real credentials —
# ANUBIS_ED25519_PRIVATE_KEY_HEX, FALCO_INGEST_TOKEN, BRAVE_SEARCH_API_KEY,
# NEWS_API_KEY, TORRENT_TURN_PASSWORD). The copy in this git checkout is a
# DIFFERENT, SMALLER file (109 keys) and is NOT the production config. Building
# a Secret from the checkout is one of the easier ways to take the site down
# with a config that looks plausible.
#
# THERE ARE FOUR SECRETS. Two are generic key/value, one is a whole file, one is
# a TLS pair:
#
#   maniwani-env       one Secret key per variable. Consumed by `secretKeyRef`
#                      from data/, app/ and media/. A MISSING KEY that is not
#                      marked `optional: true` leaves the pod in
#                      CreateContainerConfigError with the key name in the
#                      event — loud and instantly diagnosable, which is why the
#                      manifests deliberately do not mark them optional.
#   maniwani-dotenv    the WHOLE .env file as a single key named `.env`,
#                      mounted at /maniwani/.env in the backend pod. This is the
#                      app's PRIMARY CONFIG CHANNEL (backend/shared.py reads it
#                      at import AND re-reads it at runtime when an admin hits
#                      "reload env"), so all ~126 keys travel this way and must
#                      NOT be duplicated into any `env:` block.
#   maniwani-tls       the certbot pair. See §5.4 of the README for the
#                      hostPath-vs-Secret split — coturn and the edge nginx read
#                      the pair from a hostPath so the existing renewal loop
#                      keeps working; this Secret exists for consumers that need
#                      a kubernetes.io/tls object.
#   ergo-ircd-config   deploy-configs/ergo/ircd.yaml FROM THE LIVE HOST. It
#                      contains the oper password bcrypt hash; the copy in git
#                      is a cost-04 placeholder, i.e. not the real credential.
#
# HOW TO READ THE ANNOTATIONS ON EACH KEY:
#   [live]    present in /home/ubuntu/maniwani/.env today — copy it, don't type it
#   [ADD]     NOT in .env today. The Secret must be EXTENDED with it or the
#             consuming pod will not start. This is the gap list; read §5.2.
#   [edit]    present in .env but the VALUE must change for k3s before the
#             maniwani-dotenv Secret is created. Read §5.3.
#   [opt]     the manifest marks it `optional: true` — absence is tolerated.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: maniwani-env-example-do-not-apply
  namespace: maniwani
  labels:
    app.kubernetes.io/part-of: maniwani
    maniwani.io/purpose: key-inventory
  annotations:
    maniwani.io/real-name: "maniwani-env"
    maniwani.io/how: "bootstrap/README.md §5.2 — grep a subset out of the live .env, never echo a value"
type: Opaque
# Values are intentionally empty. Every entry is a KEY NAME and a consumer.
stringData:
  # ---------------------------------------------------------------------------
  # DATA TIER — data/10-postgres.yaml
  # ---------------------------------------------------------------------------
  # (!) THE POSTGRES GAP. These three are inline LITERALS in docker-compose.yml
  # (services.postgres.environment) and are NOT in .env. Copy them out of the
  # compose file — do not invent them and do not type them from memory: the same
  # user/password pair also appears in deploy-configs/maniwani.cfg's
  # SQLALCHEMY_DATABASE_URI and in the backend's env. Three places, one value.
  # If they are missing, postgres never starts and the whole site is down.
  POSTGRES_USER: ""       # [ADD] postgres StatefulSet; also encoded in maniwani.cfg
  POSTGRES_PASSWORD: ""   # [ADD] postgres StatefulSet; also encoded in maniwani.cfg
  POSTGRES_DB: ""         # [ADD] postgres StatefulSet; also encoded in maniwani.cfg
  # ---------------------------------------------------------------------------
  # APP TIER — app/10-maniwani.yaml, app/30-anubis.yaml
  # ---------------------------------------------------------------------------
  ANUBIS_ED25519_PRIVATE_KEY_HEX: ""  # [live] anubis. Rotating it invalidates every
                                      #        outstanding proof-of-work challenge.
  FALCO_INGEST_TOKEN: ""              # [live] backend /falco/ingest/<token> AND the
                                      #        falco sender. One value, two consumers.
  DOMAIN: ""                          # [live] edge nginx host guard (40-nginx.yaml, pending)
  DOMAIN_ALIASES: ""                  # [ADD]  edge nginx. Absent from .env; note that
                                      #        www.syndichan.org has NO A record today.

  # ---------------------------------------------------------------------------
  # MEDIA GROUP — media/20-seedbox.yaml, 40-coturn.yaml, 80-nntp-hub.yaml
  # ---------------------------------------------------------------------------
  # Shared by the backend and syndichan-node. The node consumes these through
  # projected files, so values never appear in pod arguments or environment.
  S3_ACCESS_KEY: ""            # [ADD] primary S3 gateway access key
  S3_SECRET_KEY: ""            # [ADD] at least 32 characters
  TORRENT_PUBLIC_HOST: ""      # [live] seedbox + backend absolute torrent/media URLs
  TORRENT_PUBLIC_SECURE: ""    # [live] seedbox + backend
  TORRENT_TURN_HOST: ""        # [live] coturn (+ the admin torrent-monitor probe)
  TORRENT_TURN_EXTERNAL_IP: "" # [live] coturn
  TORRENT_TURN_PORT: ""        # [live] coturn
  TORRENT_TURNS_PORT: ""       # [live] coturn
  TORRENT_TURN_MIN_PORT: ""    # [live] coturn relay range floor (49152 today)
  TORRENT_TURN_MAX_PORT: ""    # [live] coturn relay range ceiling (49351 today)
  TORRENT_TURN_USERNAME: ""    # [live] coturn
  TORRENT_TURN_PASSWORD: ""    # [live] coturn + the backend's ICE config. REAL SECRET.
  NNTP_HUB_ALLOW: ""           # [ADD][opt] nntp-hub peer IP allowlist. Absent today =
                               #            allow-all, gated only by the firewall.
  NNTP_HUB_ADMIN_TOKEN: ""     # [ADD][opt] nntp-hub. Cheap hardening win at migration.

  # ---------------------------------------------------------------------------
  # NOT IN THIS SECRET, ON PURPOSE
  # ---------------------------------------------------------------------------
  # * The five aggregators mount NO secret at all — deliberate least privilege.
  #   Their only .env-derived values (USE_TOR, REDDIT_EXTRA_MIRROR_URLS) are not
  #   secrets and are literals in k8s/aggregators/*-env ConfigMaps.
  # * TRACKER_PORT / TRACKER_INTERVAL_MS / SEEDBOX_STATUS_PORT / CLAMAV_SCAN_MAX_SIZE
  #   live in the maniwani-media-config ConfigMap, NOT here: seedbox builds its
  #   announce URLs with k8s $(VAR) expansion, and an optional secretKeyRef that
  #   turns out to be absent leaves the literal string "$(TRACKER_PORT)" in the URL.
  # * Everything else in .env (NEWS_API_KEY, BRAVE_SEARCH_API_KEY, the scraper
  #   tuning knobs, ...) reaches the backend through maniwani-dotenv below and
  #   must not be duplicated here.

---
# =============================================================================
# maniwani-dotenv — THE WHOLE .env FILE AS ONE KEY
# =============================================================================
# Created with:
#   kubectl -n maniwani create secret generic maniwani-dotenv \
#     --from-file=.env=/home/ubuntu/maniwani/.env
# Mounted by app/10-maniwani.yaml at /maniwani/.env via subPath, mode 0444.
#
# THREE EDITS TO THE LIVE .env ARE REQUIRED **BEFORE** CREATING THIS SECRET.
# All three are silent-failure class, not crash class:
#
#   TRUSTED_PROXY_CIDRS=["10.42.0.0/16"]   [edit] MANDATORY. The compose value is
#       the Docker bridge range ["172.16.0.0/12"], which matches nothing in k3s.
#       Left wrong, the site looks perfectly healthy while every X-Forwarded-For
#       is untrusted and EVERY visitor IP collapses to the nginx pod's IP —
#       breaking IP bans, geoip flags, the live-visitor map and the bot-token IP
#       lock. (The backend has a config-guard initContainer that refuses to start
#       if the key is missing entirely — but a WRONG value starts fine.)
#   RTMP_INGEST_URL=rtmp://<DOMAIN>:1935/live    [edit] compose synthesised these
#   TORRENT_PUBLIC_HOST=<DOMAIN>                 [edit] from ${DOMAIN} at parse
#       time. Kubernetes has no manifest-time interpolation; unset, the URLs the
#       background sync greenlet builds fall back to `localhost`.
#
#   FIVE MORE [edit]s, from k8s/aggregators/00-scraper-common-configmap.yaml:
#       FOURCHAN_AGGREGATOR_URL=http://fourchan-aggregator:8000
#       EIGHTCHAN_AGGREGATOR_URL=http://eightchan-aggregator:8000
#       SEVENCHAN_AGGREGATOR_URL=http://sevenchan-aggregator:8000
#       REDDIT_AGGREGATOR_URL=http://reddit-aggregator:8000
#       GENERIC_AGGREGATOR_URL=http://generic-aggregator:8000
#       NSFW_CLASSIFIER_URL=http://nsfw-classifier:8000
#   The live .env holds http://localhost:800X values that only work because
#   backend/scraper_client.py rewrites them when it sees /.dockerenv — a file
#   that does not exist under containerd. Today the compose `environment:` block
#   masks it; under k3s the first admin "reload config" points every scraper
#   control call at localhost inside the backend pod.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: maniwani-dotenv-example-do-not-apply
  namespace: maniwani
  labels:
    app.kubernetes.io/part-of: maniwani
    maniwani.io/purpose: key-inventory
  annotations:
    maniwani.io/real-name: "maniwani-dotenv"
    maniwani.io/source: "/home/ubuntu/maniwani/.env on the SOFTWARE node — never the git checkout"
type: Opaque
stringData:
  # Exactly one key, named `.env`, whose value is the entire file.
  ".env": ""

---
# =============================================================================
# maniwani-tls — the Let's Encrypt pair currently issued by certbot ON the
# software node (valid to 18 Oct 2026, renewed by
# deploy-configs/certbot/renew-cert.sh under maniwani-cert-renew.timer).
# =============================================================================
#   kubectl -n maniwani create secret tls maniwani-tls \
#     --cert=/home/ubuntu/maniwani/deploy-configs/tls/fullchain.pem \
#     --key=/home/ubuntu/maniwani/deploy-configs/tls/privkey.pem
#
# `kubectl create secret tls` always produces exactly these two keys.
#
# (!) THIS SECRET IS A SNAPSHOT AND GOES STALE. Certbot rewrites the pair on the
# host every ~60 days; a Secret created from it does not update itself. Re-run
# the command with `--dry-run=client -o yaml | kubectl apply -f -` after each
# renewal, or accept an expired certificate ~60 days after cutover. This is the
# single most likely thing in this whole migration to break silently, months
# later, at 3am. See README §5.4 and §13.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: maniwani-tls-example-do-not-apply
  namespace: maniwani
  labels:
    app.kubernetes.io/part-of: maniwani
    maniwani.io/purpose: key-inventory
  annotations:
    maniwani.io/real-name: "maniwani-tls"
    maniwani.io/renewal: "re-import after every certbot renewal — it is a snapshot, not a link"
type: kubernetes.io/tls
stringData:
  tls.crt: ""   # <- deploy-configs/tls/fullchain.pem
  tls.key: ""   # <- deploy-configs/tls/privkey.pem   REAL PRIVATE KEY

---
# =============================================================================
# ergo-ircd-config — the IRC daemon config, which IS a secret
# =============================================================================
#   kubectl -n maniwani create secret generic ergo-ircd-config \
#     --from-file=ircd.yaml=/home/ubuntu/maniwani/deploy-configs/ergo/ircd.yaml
#
# media/60-ergo.yaml mounts it at /ircd/ircd.yaml with subPath (never without —
# a directory mount there shadows ircd.db). It carries opers.sysop.password as a
# bcrypt hash; the value committed to this repo is a cost-04 placeholder, so the
# LIVE file is the only correct source.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ergo-ircd-config-example-do-not-apply
  namespace: maniwani
  labels:
    app.kubernetes.io/part-of: maniwani
    maniwani.io/purpose: key-inventory
  annotations:
    maniwani.io/real-name: "ergo-ircd-config"
    maniwani.io/source: "/home/ubuntu/maniwani/deploy-configs/ergo/ircd.yaml on the SOFTWARE node"
type: Opaque
stringData:
  "ircd.yaml": ""
