apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-controller
  namespace: maniwani
data:
  config.yaml: |
    domain: syndichan.org
    public_hostname: syndichan.org
    subdomain_prefix: gw
    ttl: 300
    health_check_interval: 60
    # Drift repair is deliberately infrequent. Registration/reservation paths
    # reconcile immediately; polling Name.com every minute exhausts its quota.
    dns_sync_interval: 900
    gateway_timeout: 15
    registration_lifetime: 600
    max_gateways: 1000
    max_answers: 8
    network_policy_sync_enabled: true
    network_policy_sync_interval: 30
    network_policy_namespace: maniwani
    network_policy_name: nginx-gateway-ingress
    network_policy_gateway_port: 9443
    expected_gateway_header: X-Gateway-Version
    expected_gateway_path: /readyz
    trusted_proxy_cidrs:
      - 10.42.0.0/16
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-controller
  namespace: maniwani
  labels: &labels
    app: gateway-controller
    app.kubernetes.io/name: gateway-controller
    app.kubernetes.io/part-of: maniwani
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-controller
  template:
    metadata:
      labels:
        <<: *labels
        # The data-tier NetworkPolicies admit explicitly labelled clients.
        maniwani.io/postgres-client: "true"
        maniwani.io/redis-client: "true"
    spec:
      serviceAccountName: gateway-controller
      enableServiceLinks: false
      nodeSelector:
        maniwani.io/role: software
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: registry.local/syndichan-gateway-controller:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: GATEWAY_CONFIG
              value: /etc/gateway/config.yaml
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-controller-database
                  key: url
            # Projected from the two NAMECOM_ lines of the stack's .env — see
            # README.md. Only those two keys are in this Secret: the app tier's
            # whole .env is deliberately NOT mounted here, so compromising the
            # controller does not hand over NEWS_API_KEY or the Anubis key.
            - name: NAMECOM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gateway-controller-namecom
                  key: NAMECOM_USERNAME
            - name: NAMECOM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-controller-namecom
                  key: NAMECOM_API_TOKEN
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-controller-redis
                  key: url
                  optional: true
          volumeMounts:
            - {name: config, mountPath: /etc/gateway, readOnly: true}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: gateway-controller
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-controller
  namespace: maniwani
spec:
  selector:
    app: gateway-controller
  ports:
    - {name: http, port: 8080, targetPort: http}
