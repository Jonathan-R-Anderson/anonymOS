# =============================================================================
# maniwani UPDATER — IDENTITY. ServiceAccount + Role + RoleBinding.
# =============================================================================
# This file grants the auto-updater everything it needs and nothing else. It is
# the primary enforcement point for two of the three landmines named in the
# design:
#
#   * "Never delete an aggregator PVC."   -> there is NO write verb on
#     persistentvolumeclaims anywhere below, and no `delete` on any workload.
#     A bug in update.sh cannot destroy scraped content, because the API server
#     refuses the call.
#   * "Do not restart the object store as part of a routine app update." -> `postgres`,
#     `redis` and `the object store` are ABSENT from every resourceNames list. The updater
#     cannot patch, restart, scale or otherwise touch the data tier at all.
#
# Those are not comments in a shell script that someone can `sed` past. They are
# RBAC denials. Read the resourceNames lists as a deny-by-omission allowlist and
# treat adding a name to them as a security change.
#
# ROLE, NOT ClusterRole. Everything the updater touches lives in namespace
# `maniwani`. It has NO cluster-scoped permission of any kind: it cannot read
# nodes, cannot read or create namespaces, cannot touch StorageClasses or
# PriorityClasses, and cannot see any other namespace. A commit that changes
# k8s/bootstrap/** therefore cannot be applied by the updater even if the gate
# in update.sh were removed — the apply would 403.
#
# -----------------------------------------------------------------------------
# WHAT IS DELIBERATELY *NOT* HERE — read this before "fixing" a Forbidden error
# -----------------------------------------------------------------------------
#
#  (a) NO VERBS ON `secrets`. AT ALL. Not even `get`.
#      The updater needs two secrets — the GitHub deploy key and the postgres
#      credentials — and it gets BOTH without RBAC, because a Secret consumed as
#      a `volume` or via `secretKeyRef` is resolved BY THE KUBELET on the
#      updater's behalf, not by the pod's ServiceAccount. See 40-cronjob.yaml.
#      This is a real reduction in blast radius over the obvious
#      `kubectl get secret ... | base64 -d` design: a shell injection in
#      update.sh cannot enumerate the 114-key maniwani-env Secret.
#      (See the honest caveat about `create jobs` in (d) below — it is not a
#      perfect boundary, but it is a much narrower one.)
#
#  (b) NO `create` ON WORKLOADS. This is not an oversight and it cannot be
#      worked around with resourceNames: RBAC IGNORES resourceNames FOR `create`,
#      because the object's name is not known at authorization time. Granting
#      `create` on deployments would therefore grant it for ANY name — including
#      a fresh privileged Deployment of the attacker's choosing.
#      CONSEQUENCE, and it is a real operational limit: a commit that adds a
#      BRAND-NEW workload (a new aggregator, a new sidecar Deployment) will fail
#      to apply with `Forbidden`. update.sh detects this ahead of time and halts
#      in the gate phase rather than part-applying. Adding a new service to the
#      cluster stays a deliberate human `kubectl apply`. Adding its NAME here is
#      the second half of that human step.
#
#  (c) NO WRITE ON `services`, `networkpolicies`, `persistentvolumeclaims`,
#      `serviceaccounts`, `roles`, `rolebindings`, `cronjobs`.
#      Read-only on the first three so update.sh can compare rendered manifests
#      against what is live; entirely absent for the rest.
#      * PVCs: the landmine. Also note that update.sh does NOT use `kubectl diff`
#        for its PVC drift gate — `kubectl diff` is a SERVER-SIDE DRY RUN and is
#        authorized exactly like the real write, so using it would force a
#        `patch` grant on PVCs and defeat this entire rule. The gate is a text
#        comparison of two rendered trees instead. See update.sh `gate_pvc`.
#      * cronjobs: the updater cannot modify its own schedule or its own pod
#        spec. A self-modifying updater that breaks itself is unrecoverable
#        without the SSH login this whole feature exists to avoid.
#
#  (d) `create` ON `jobs` IS THE ONE UNRESTRICTED MUTATION, AND IT IS A REAL
#      PRIVILEGE. Stated plainly rather than buried: anyone who can create a Job
#      in this namespace can write a pod spec that mounts ANY Secret in the
#      namespace (the kubelet resolves it — see (a)), and can run any image
#      already present in containerd on the software node. `create jobs` in
#      namespace maniwani is therefore, in practice, "can read every secret in
#      namespace maniwani".
#      It cannot be avoided: the whole point of hoisting alembic out of the
#      backend's boot path (design §5.3) is that migrations run as a discrete
#      Job whose failure is cheap. It CAN be bounded, and is:
#        * the Role is namespaced, so it is not "any pod anywhere";
#        * there is no `patch`/`update` on jobs, so an existing Job cannot be
#          mutated, only created and deleted;
#        * the escalation is not a NEW one — see the header of 40-cronjob.yaml:
#          this pod already holds the docker socket, which is root on the node
#          and strictly more powerful than reading a namespace's secrets.
#      If you ever remove the docker socket (i.e. move to the host-systemd
#      variant in the README), revisit this rule: it becomes the largest
#      remaining grant rather than a rounding error.
#
#  (e) NO `pods/exec`. An earlier draft took the pre-migration `pg_dump` with
#      `kubectl exec sts/postgres -- pg_dump`. That needs `create` on
#      `pods/exec`, which is a shell inside the database pod. It is unnecessary:
#      k8s/data/networkpolicy.yaml already permits any pod labelled
#      `maniwani.io/postgres-client: "true"` to reach postgres:5432, so the
#      updater carries that label and runs pg_dump over the network with a
#      client binary in its own image. One label instead of one shell.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maniwani-updater
  namespace: maniwani
  labels:
    app: maniwani-updater
    app.kubernetes.io/name: maniwani-updater
    app.kubernetes.io/part-of: maniwani
    app.kubernetes.io/component: updater
    maniwani.io/group: updater
# The token IS mounted (unlike falco, which sets this false) — kubectl is the
# updater's entire reason for existing. Projected-token default: 1h TTL,
# auto-rotated by the kubelet. There is no static, long-lived token to steal.
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maniwani-updater
  namespace: maniwani
  labels:
    app.kubernetes.io/name: maniwani-updater
    app.kubernetes.io/part-of: maniwani
    app.kubernetes.io/component: updater
    maniwani.io/group: updater
rules:
  # ---------------------------------------------------------------------------
  # 1. READ. Collection-wide, because it has to be.
  # ---------------------------------------------------------------------------
  # `list` and `watch` CANNOT be narrowed with resourceNames — a LIST request
  # names a collection, not an object, so the authorizer has no name to match
  # and the rule simply never fires. Any design that claims "list, but only
  # these three" is not describing Kubernetes RBAC. Read access to the whole
  # namespace's non-secret objects is therefore the floor, and it is accepted:
  # none of it is a credential, and `kubectl rollout status` (GET + WATCH) and
  # the failure diagnostics in update.sh (describe / logs / events) are useless
  # without it.
  #
  # `pods/log` is what makes the error log actually diagnostic rather than
  # "rollout timed out, good luck". It is also the most sensitive read here:
  # application logs can contain request paths and, in a bad moment, tokens.
  # update.sh runs its captured output through a redactor before writing it to
  # the operator-visible log — see the REDACTION note in 30-configmap-*.yaml.
  - apiGroups: [""]
    resources:
      - pods              # rollout progress, CrashLoopBackOff detection
      - pods/log          # THE failure diagnostic; --previous for crashloops
      - events            # "Failed to pull", "OOMKilled", scheduling failures
      - services          # render-vs-live comparison only; never written
      - configmaps        # read every CM to hash keys and decide what to restart
      - persistentvolumeclaims   # READ-ONLY. The landmine gate reads these.
      - endpoints         # is the Service actually backed after a roll?
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]

  # ---------------------------------------------------------------------------
  # 2. MUTATE WORKLOADS — the allowlist. THIS IS THE SECURITY BOUNDARY.
  # ---------------------------------------------------------------------------
  # `patch`  -> kubectl apply (client-side apply issues a strategic-merge PATCH
  #             against an existing object) and `kubectl rollout restart` (which
  #             patches a pod-template annotation).
  # `update` -> kubectl apply falls back to a full PUT when the strategic merge
  #             is rejected (notably on `apps/v1` objects whose selector fields
  #             confuse the merge patcher). Without it, some applies fail with a
  #             confusing 422 rather than a clean 403.
  # `get`    -> apply reads the current object first. Already granted above;
  #             repeated here so this rule is self-contained if the read rule is
  #             ever narrowed.
  #
  # NO `delete`. Deleting a StatefulSet with the default (Foreground/Background)
  # propagation deletes its pods but NOT its PVCs — however, `--cascade` and
  # future StatefulSetAutoDeletePVC semantics make that a promise this project
  # should not rely on for 22 GB of unreproducible scraped content. Rollback
  # never needs delete: it re-applies the previous rendered manifest, which is a
  # PATCH. See update.sh `rollback_apply`.
  #
  # NO `scale` SUBRESOURCE. The updater has no business scaling anything; the
  # only legitimate scale-to-zero in this design (before a pg_restore) is an
  # explicitly manual, human step printed into the failure log.
  #
  # THE NAMES BELOW ARE EXHAUSTIVE AND WERE TAKEN FROM THE LIVE MANIFESTS.
  # Absent on purpose:  postgres  redis  the object store   (k8s/data/** — data tier)
  # A single rule may list resourceNames spanning several resources; a name only
  # ever authorizes the object that actually bears it.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    resourceNames:
      # --- app tier (k8s/app/) -------------------------------------------------
      - maniwani                 # StatefulSet, backend
      - maniwani-frontend        # Deployment
      - anubis                   # Deployment
      - nginx                    # Deployment — THE EDGE, Recreate/hostPort. See §4.4.
      - syndichan-node           # StatefulSet, storage/DHT bootstrap
      - gateway-controller       # Deployment, server-side gateway DNS controller
      # --- aggregators (k8s/aggregators/) -------------------------------------
      # All four chan scrapers share ONE image (fourchan-aggregator-plus); a
      # rebuild of that context rolls all four. Their PVCs are untouchable above.
      - fourchan-aggregator
      - eightchan-aggregator
      - sevenchan-aggregator
      - generic-aggregator
      - reddit-aggregator
      - nsfw-classifier
      - code-runner              # Deployment, sandboxed judge for arcade submissions
      # k8s/storage/20-node-bootstrap-edge.yaml is already in the repo and
      # already inside the apply set, but this name was in neither allowlist.
      # Editing that file therefore 403'd mid-apply, rolled back, and repeated
      # every tick -- a live wedge, not a hypothetical one.
      - node-bootstrap-edge      # Deployment, .well-known storage-node bootstrap edge
      - redlib                   # third-party image; patched only if the manifest changed
      # --- media (k8s/media/) --------------------------------------------------
      - rtmp                     # replicas: 0 today — patched, not rolled
      - seedbox
      - tracker
      - coturn                   # replicas: 0 today
      - clamav
      - ergo
      - glados-tts               # image rebuild REFUSED by update.sh; manifest edits OK
      - nntp-hub
      - falco                    # DaemonSet, pinned third-party image
    verbs: ["get", "patch", "update"]

  # ---------------------------------------------------------------------------
  # 3. CONFIGMAPS — write, by name only.
  # ---------------------------------------------------------------------------
  # Two distinct jobs:
  #   (i)  apply a changed ConfigMap from the repo, then `rollout restart` its
  #        consumers. This is not optional bookkeeping: nginx.conf, maniwani.cfg
  #        and .env are mounted with `subPath`, and A subPath MOUNT NEVER
  #        RECEIVES CONFIGMAP UPDATES — the kubelet does not propagate into it.
  #        Applying the ConfigMap alone changes nothing until the pod restarts.
  #   (ii) publish maniwani-deploy-status, the kubectl-readable mirror of
  #        status.json (see 90-configmap-deploy-status.yaml).
  #
  # `create` is absent, so maniwani-deploy-status MUST be applied by hand once
  # (it ships in this directory) or the status mirror silently no-ops. The
  # authoritative status is the file on the PVC that nginx serves; the mirror is
  # a convenience, and update.sh treats a failed mirror patch as a warning.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - nginx-conf                    # THE EDGE CONFIG. subPath-mounted.
      - maniwani-cfg                  # subPath-mounted at /maniwani/runtime-config.cfg
      - anubis-policy
      - log-init-script               # mounted by ~11 pods' initContainer
      - scraper-common-env
      - fourchan-aggregator-env
      - eightchan-aggregator-env
      - sevenchan-aggregator-env
      - generic-aggregator-env
      - reddit-aggregator-env
      - nsfw-classifier-env
      - redlib-env
      - maniwani-media-config
      - node-bootstrap-edge          # ships in the same manifest as the Deployment above
      - coturn-start
      - falco-local-rules
      - gateway-controller
      - maniwani-deploy-status        # the status mirror
    verbs: ["get", "patch", "update"]

  # ---------------------------------------------------------------------------
  # 4. JOBS — migration and downgrade. See (d) in the header: this is the one
  #    unrestricted mutation and it is equivalent to namespace secret read.
  # ---------------------------------------------------------------------------
  # `create` : the per-SHA migration Job and, on failure, the downgrade Job.
  #            Cannot be name-restricted (see (b)); the names are generated.
  # `delete` : reap a previous run's Job before creating a same-named one, and
  #            clean up on abort. ttlSecondsAfterFinished handles the happy path,
  #            but a controller-managed TTL is not something a rollback can wait
  #            on.
  # NO patch/update: a Job's spec is immutable anyway, and denying it removes any
  # illusion that a running migration can be edited mid-flight.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete"]

  # ---------------------------------------------------------------------------
  # 5. DELETE PODS — the wedged-pod nudge, and nothing else.
  # ---------------------------------------------------------------------------
  # Rollback re-applies the previous manifest, but a StatefulSet pod already in
  # CrashLoopBackOff or ImagePullBackOff does not necessarily get replaced
  # promptly by the template change. update.sh waits 30 s and, if the pod still
  # reports the NEW image, deletes it so the controller recreates it from the
  # reverted template.
  #
  # Cannot be name-restricted: pod names carry generated suffixes.
  #
  # WHY THIS IS ACCEPTABLE: `delete pod` is DISRUPTIVE but not ESCALATING and
  # not DESTRUCTIVE. Every pod in this namespace is owned by a controller and is
  # recreated. It cannot delete a PVC (rule 1 is read-only there), so no scraped
  # content, no postgres data and no the object store OSD is at risk.
  #
  # WHAT UPDATE.SH MUST NEVER DO, and does not: `--force --grace-period=0`. On a
  # StatefulSet with an RWO volume that tells the API server the pod is gone
  # before it actually is, and the replacement can be scheduled while the old
  # process still holds the volume — two writers on one SQLite file. Plain
  # `kubectl delete pod` only.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]

  # ---------------------------------------------------------------------------
  # 6. (COMMENTED OUT) THE HOST-SYSTEMD VARIANT ONLY. Do not enable for the
  #    CronJob.
  # ---------------------------------------------------------------------------
  # This directory contains TWO updater implementations (see MANIFESTS.md §0):
  #   * the in-cluster CronJob (40-cronjob.yaml + the script in
  #     30-configmap-updater.yaml) — what the rules above are written for
  #   * a host-side systemd variant (README.md + update.sh in this directory)
  #
  # THEY NEED DIFFERENT PERMISSIONS, and the difference is not cosmetic:
  #
  #   A POD can receive a Secret through a `volume` or `secretKeyRef`, which the
  #   KUBELET resolves on its behalf — no RBAC involved. That is why rule 1 has
  #   no verb on `secrets` at all, and it is a genuine reduction in blast radius.
  #
  #   A SYSTEMD UNIT ON THE HOST has no kubelet doing that for it. It must fetch
  #   the deploy key itself:
  #       kubectl get secret maniwani-git-deploy-key -o jsonpath='{.data...}'
  #   ...which requires the grant below. update.sh (the host variant) also
  #   `kubectl create configmap maniwani-deploy-status`s its status mirror rather
  #   than patching a pre-applied one, which requires `create` on configmaps —
  #   a verb that CANNOT be name-restricted (RBAC ignores resourceNames for
  #   `create`), so enabling it grants creation of arbitrary ConfigMaps in this
  #   namespace.
  #
  # IF YOU ADOPT THE HOST VARIANT: uncomment both rules below, and apply
  # 90-configmap-deploy-status.yaml anyway so the `create` is never exercised.
  # IF YOU KEEP THE CRONJOB: leave them commented. Enabling them weakens the
  # boundary for no benefit — the CronJob does not use either path.
  #
  # - apiGroups: [""]
  #   resources: ["secrets"]
  #   resourceNames: ["maniwani-git-deploy-key"]   # the deploy key ONLY
  #   verbs: ["get"]
  # - apiGroups: [""]
  #   resources: ["configmaps"]
  #   verbs: ["create"]                            # cannot be name-restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maniwani-updater
  namespace: maniwani
  labels:
    app.kubernetes.io/name: maniwani-updater
    app.kubernetes.io/part-of: maniwani
    app.kubernetes.io/component: updater
    maniwani.io/group: updater
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maniwani-updater
subjects:
  - kind: ServiceAccount
    name: maniwani-updater
    namespace: maniwani
# =============================================================================
# VERIFY AFTER APPLY — assert the DENIALS, not just the grants. A Role that
# grants what you meant and also everything else still passes a "can it deploy"
# test. Run all of these; the four `no` answers are the point of the file.
#
#   S=system:serviceaccount:maniwani:maniwani-updater
#   kubectl auth can-i patch statefulset/maniwani     -n maniwani --as=$S   # yes
#   kubectl auth can-i patch statefulset/postgres     -n maniwani --as=$S   # NO
#   kubectl auth can-i patch statefulset/ceph         -n maniwani --as=$S   # NO
#   kubectl auth can-i delete pvc/aggregator-4chan    -n maniwani --as=$S   # NO
#   kubectl auth can-i get    secrets                 -n maniwani --as=$S   # NO
#   kubectl auth can-i create deployments             -n maniwani --as=$S   # NO
#   kubectl auth can-i patch  cronjob/maniwani-updater -n maniwani --as=$S  # NO
#   kubectl auth can-i '*'    '*'                     -n maniwani --as=$S   # NO
#
# (`kubectl auth can-i patch pvc/...` reports on the resource+name pair; PVCs
#  have no write rule at all, so every verb but get/list/watch answers no.)
# =============================================================================
