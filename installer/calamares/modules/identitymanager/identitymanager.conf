# Identity Manager configuration — the selectable Identity profiles (Phase 6).
# Each maps to an EpinAnonymOS Domain object (cf. core/domain.d / config/domains.json).
# `devices` mirrors the DM8 device-class gate bitmask; the installer only DESCRIBES these,
# first boot realises them as objects.
---
requireAdministrator: true

profiles:
  - id: personal
    name: "Personal"
    description: "Everyday use — full device access."
    devices: 0x3f
    default: true
  - id: work
    name: "Work"
    description: "Work apps and accounts, no camera/mic by default."
    devices: 0x33
    default: true
  - id: banking
    name: "Banking"
    description: "Hardened: network-restricted, no camera/mic/USB."
    devices: 0x03
    default: false
  - id: research
    name: "Research"
    description: "Isolated browsing and tooling."
    devices: 0x3f
    default: false
  - id: disposable
    name: "Disposable"
    description: "Ephemeral — state discarded on close."
    devices: 0x03
    default: false
  - id: anonymous
    name: "Anonymous"
    description: "Tor/I2P-routed, no persistent identity."
    devices: 0x03
    default: false
