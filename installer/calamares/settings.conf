# EpinAnonymOS — Calamares install sequence (roadmap/INSTALLER.md Phases 5–10).
# This OS is not a chroot target: modules act through the object FS + capability syscalls,
# so dont-chroot is set and the disk/bootloader/config steps are custom (epin* modules).
---
modules-search: [ local, /installer/calamares/modules ]

instances:
- id:     epin
  module: epinpartition
  config: epinpartition.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - epinpartition          # native object-FS disk module (§D2(b)); KPMcore `partition` is the fallback
  - identitymanager        # custom: Administrator + Identity profiles (Phase 6)
  - summary
- exec:
  - epinpartition          # lay down GPT + ESP + rootfs on the chosen disk
  - epincopy               # copy the OS payload (kernel + modules) to the target
  - epinbootloader         # install limine (UEFI/BIOS), generate limine.conf
  - epinconfig             # write the declarative install.json (Phase 7)
- show:
  - finished

branding: epinanonymos

prompt-install: true
dont-chroot: true          # act via the object FS / capability syscalls, not a chroot
oem-setup: false
disable-cancel-during-exec: true
