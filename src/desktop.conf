# EpinAnonymOS desktop configuration  —  the one file that customizes the GUI.
#
# Edit this file and rebuild the ISO (`WESTON=1 make hos.iso`) to change the
# desktop.  It is read by the Weston desktop shell at boot from /desktop.conf.
# Lines starting with '#' are comments.

# ── Autostart ─────────────────────────────────────────────────────────────
# Apps launched automatically when the desktop comes up.  List one per line.
#
# GNOME model: the desktop boots to a CLEAN top bar + wallpaper — nothing is
# auto-started.  Launch apps from the "Activities" button / app grid (SUPER+A),
# and reach the system menu (Wi-Fi / volume / battery / power) from the
# top-right indicator cluster.  The Wi-Fi state now lives IN the panel indicator
# (it polls /run/wifi/networks), so the standalone wl-wifi-menu window is no
# longer auto-started — it opens on demand from Quick Settings and SUPER+W.
# (To restore a permanent window, add e.g. `autostart = /wl-domain-manager`.)
#
# The app grid opens on boot so every utility program is VISIBLE + launchable right
# away (click a tile, or type-to-search + Enter).  It is ALSO reachable any time from
# the "Activities" button (top-left) / SUPER+A; press Esc to dismiss it to a clean desktop.
autostart = /wl-overview
# Wi-Fi bring-up diagnostics are deliberately visible at boot while network detection is being
# debugged.  wl-logview starts on /run/wpa-agent.log, the direct-WPA scan/provider status screen.
autostart = /wl-logview
# INSTALLER D4.1/D4.3 — the live "Install EpinAnonymOS to Disk" installer auto-launches on a
# live boot (no key combo): `autostart-live` is launched on a short delay so it maps on top of
# the desktop and is the front window.  `autostart-live` / `bind-live` directives are LIVE-MEDIA
# ONLY — the shell runs them while the OS is not yet installed and SKIPS them once it is (install
# marker /install.json present), so the installer disappears from every future startup after
# install.  (hos-term, the R1 Rust terminal, is launch-on-demand via SUPER+R.)
# (gl-wl-test, the R3 GLES2 client demo, is launch-on-demand via SUPER+G.)
# (gl-term, the R3 GLES2 terminal, is launch-on-demand via SUPER+L.)
autostart-live = /calamares

# ── Keybindings ───────────────────────────────────────────────────────────
# Format:  bind = MODIFIERS, KEY, exec, COMMAND
#   MODIFIERS : SUPER, CTRL, ALT, SHIFT  (combine with '+', e.g. SUPER+SHIFT)
#   KEY       : a letter/digit, or Return / Space / Tab
#   COMMAND   : absolute path of the program to launch
#
# Press the Super (Windows/logo) key with the listed key to launch the app.
#
# GNOME shell surfaces (also reachable by clicking the top-bar widgets):
bind = SUPER, A, exec, /wl-overview        # Activities: app grid + type-to-search
bind = SUPER, C, exec, /wl-calendar        # clock/calendar popover
bind = SUPER, S, exec, /wl-quicksettings   # system menu: wifi/volume/battery/power
# Core apps:
# Terminal: /hos-wifiterm = wl-term with EPIN_SHELL=light (zsh -f -i, no compinit fork-storm),
# software-rendered — reliable on the FW13 Pixman desktop.  (Plain /wl-term's full login zsh can
# stall the desktop; /gl-term needs a GPU — still on SUPER+Y for the virgl desktop.)
bind = SUPER, Return, exec, /hos-wifiterm
bind = SUPER, T, exec, /hos-wifiterm
bind = SUPER, E, exec, /wl-files           # Files
bind = SUPER, D, exec, /wl-domain-manager  # Settings / Domain Manager
bind = SUPER, W, exec, /wl-wifi-menu        # Wi-Fi picker (also from Quick Settings)
bind = SUPER+ALT, L, exec, /wl-logview      # Logs (SUPER+L is now tiling focus-right)
bind = SUPER, Y, exec, /gl-term             # GLES2 terminal (GPU desktop)
bind = SUPER, G, exec, /gl-wl-test
# GNOME utility programs:
bind = SUPER+ALT, K, exec, /wl-calc         # Calculator (SUPER+K is now tiling focus-up)
bind = SUPER, M, exec, /wl-sysmon           # System Monitor
bind = SUPER, N, exec, /wl-editor           # Text Editor
bind = SUPER, I, exec, /wl-imgview          # Image Viewer
bind = SUPER, O, exec, /wl-clocks           # Clocks
bind = SUPER, U, exec, /wl-chars            # Characters
bind = SUPER, P, exec, /wl-screenshot       # Screenshot
# (Installer is auto-launched via `autostart-live` above — no key combo.)

# ── Appearance ────────────────────────────────────────────────────────────
# Background color shown behind windows (0xRRGGBB).
background = 0x1e2430

# ── Persistent storage (roadmap 1.2) ─────────────────────────────────────────────────────────
# Which paths survive a reboot.  The kernel serialises these subtrees into the object store on
# the disk's free tail, and restores them at boot before any userspace runs.
#
# One directive per path; absolute paths only.  With NO persist line the kernel defaults to
# /home, so removing these does not silently turn persistence off.
#
# DO NOT list anything the boot modules regenerate -- /usr, /lib, /sbin, /busybox, the xkb data,
# the zsh functions.  Those are rebuilt from the image on every boot, and a persisted copy would
# SHADOW an updated system file after an upgrade: the machine keeps running the old one, with no
# error anywhere.  Persist what a user creates, not what the image ships.
#
# An empty list is a legitimate configuration, not a mistake: a deliberately amnesiac machine is
# a reasonable thing to want from a deniable OS.  To get it, set `persist = /nonexistent`.
persist = /home
persist = /root

# ── Font / icon / theme packs (ROADMAP 2.4) ────────────────────────────────────────────────────
# Installed packs go under /home, which is why they survive a reboot -- the `persist = /home`
# line above is what makes an install stick.  Do NOT install packs into /usr/share/{fonts,icons,
# themes}: those are rebuilt from the asset blobs on every boot and anything put there is gone at
# the next one (and see the warning above about persisting image paths).
#
# The directories exist from first boot and are scanned automatically:
#
#   fonts   ~/.local/share/fonts    ~/.fonts     (both listed in /etc/fonts/fonts.conf)
#   icons   ~/.local/share/icons    ~/.icons     (GTK reads $XDG_DATA_HOME/icons)
#   themes  ~/.local/share/themes   ~/.themes
#
# To install, unpack into one of them from wl-term -- busybox provides tar, unzip and gunzip:
#
#   /busybox tar -xzf mypack.tar.gz -C /home/user/.local/share/icons
#
# A theme or icon pack is a directory containing index.theme; a font pack is just font files.
# NOTE: icons must be PNG.  librsvg is currently a stub here, so gdk-pixbuf cannot decode SVG at
# all and an SVG-only pack will silently resolve to nothing.
