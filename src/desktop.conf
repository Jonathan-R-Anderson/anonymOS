# EpinAnonymOS desktop configuration  —  the one file that customizes the GUI.
#
# Edit this file and rebuild the ISO (`WESTON=1 make hos.iso`) to change the
# desktop.  It is read by the Weston desktop shell at boot from /desktop.conf.
# Lines starting with '#' are comments.

# ── Autostart ─────────────────────────────────────────────────────────────
# Apps launched automatically when the desktop comes up.  List one per line.
# (If none are listed, the Qubes-style Domain Manager is launched by default.)
autostart = /wl-domain-manager
# >>> TEMPORARY (WiFi/M3 debugging) — remove these two lines to revert.  Autostarts a LIGHTWEIGHT
# terminal (hos-wifiterm -> wl-term with `zsh -f`, no compinit fork-storm) so `/hos-nmcli-test` can be
# run.  The plain `/wl-term` autostart (full zsh) exhausted the task table and stalled the desktop.
autostart = /hos-wifiterm
# <<< end temporary
# INSTALLER D4.1/D4.3 — the live "Install EpinAnonymOS to Disk" installer auto-launches on a
# live boot (no key combo): `autostart-live` is launched on a short delay so it maps on top of
# the desktop and is the front window.  `autostart-live` / `bind-live` directives are LIVE-MEDIA
# ONLY — the shell runs them while the OS is not yet installed and SKIPS them once it is (install
# marker /install.json present), so the installer disappears from every future startup after
# install.  (hos-term, the R1 Rust terminal, is launch-on-demand via SUPER+R.)
# (gl-wl-test, the R3 GLES2 client demo, is launch-on-demand via SUPER+G.)
# (gl-term, the R3 GLES2 terminal, is launch-on-demand via SUPER+L.)
autostart-live = /calamares

# ── Keybindings ───────────────────────────────────────────────────────────
# Format:  bind = MODIFIERS, KEY, exec, COMMAND
#   MODIFIERS : SUPER, CTRL, ALT, SHIFT  (combine with '+', e.g. SUPER+SHIFT)
#   KEY       : a letter/digit, or Return / Space / Tab
#   COMMAND   : absolute path of the program to launch
#
# Press the Super (Windows/logo) key with the listed key to launch the app.
bind = SUPER, Return, exec, /wl-term
bind = SUPER, T, exec, /wl-term
bind = SUPER, E, exec, /wl-files
bind = SUPER, D, exec, /wl-domain-manager
bind = SUPER, G, exec, /gl-wl-test
bind = SUPER, L, exec, /gl-term
# (Installer is auto-launched via `autostart-live` above — no key combo.)

# ── Appearance ────────────────────────────────────────────────────────────
# Background color shown behind windows (0xRRGGBB).
background = 0x1e2430
