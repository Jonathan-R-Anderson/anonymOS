splash = false

# Dendritic network topology — the same radial keyspace graph the dendritic
# website embedded. The PNG ships inside this config tree
# (system/hypr/wallpapers/) and is unpacked to ~/.config/hypr/wallpapers/ at
# boot by pack-hyprcfg, so this absolute path resolves on the guest (user "user").
preload = /home/user/.config/hypr/wallpapers/dendritic-network.png

# A leading "," targets every monitor rather than only the laptop panel eDP-1,
# so the wallpaper shows on VMs/desktops whose output is named differently.
wallpaper = ,/home/user/.config/hypr/wallpapers/dendritic-network.png
